name: build
on:
  push: { branches: [main] }
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.10.2" }
      - run: chmod +x gradlew
      - run: |
          if [ ! -f release.jks ]; then
            keytool -genkeypair -alias miniarcade -keyalg RSA -keysize 2048 -validity 10000 -storepass miniarcade -keypass miniarcade -keystore release.jks -dname "CN=Rennvol" -storetype JKS
          else
            echo "release.jks exists, reusing stable key"
          fi
          ls -lh release.jks
      - run: ./gradlew :app:assembleRelease --stacktrace
      - uses: actions/upload-artifact@v4
        with: { name: mini-arcade-apk, path: app/build/outputs/apk/release/*.apk }
